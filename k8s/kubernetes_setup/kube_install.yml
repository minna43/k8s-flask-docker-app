- name: Install dependencies for kubernetes
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - apt-transport-https
    - ca-certificates
    - curl

- name: Add Kubernetes key (safe method)
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key \
    | gpg --dearmor \
    | tee /etc/apt/keyrings/kubernetes-apt-keyring.gpg > /dev/null

- name: Add kubernetes repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
    state: present
    filename: kubernetes
    update_cache: yes

- name: Update apt
  apt:
    update_cache: yes

- name: Install kubernetes packages
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - kubeadm
    - kubelet
    - kubectl

- name: Hold kube packages
  command: apt-mark hold "{{ item }}"
  loop:
    - kubeadm
    - kubelet
    - kubectl
  register: hold_result
  changed_when: "'already' not in hold_result.stdout"

- name: Verify held packages
  command: apt-mark showhold
  register: held_packages

- name: Show held packages
  debug:
    msg: "List of held packages {{ held_packages.stdout_lines }}"

- name: Disable all swap spaces
  command: swapoff -a
  register: swapoff_result
  changed_when: swapoff_result.rc == 0
  failed_when: false

- name: Remove swap entry from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^.*\sswap\s'
    state: absent
  register: fstab_result
  changed_when: fstab_result.changed

- name: Verify swap is disabled
  command: free -h
  register: free_output

- name: Display swap status
  debug:
    msg: "Display swap status {{ free_output.stdout_lines }}"

- name: Load kernels used by container storage drivers
  command: modprobe overlay

- name: Load kernels for iptables to process bridge network
  command: modprobe br_netfilter

- name: Create containerd conf with specific modules
  shell: |
    cat <<EOF > /etc/modules-load.d/containerd.conf
    overlay
    br_netfilter
    EOF
  
- name: Create kubernetes conf with net bridge
  shell: |
    cat <<EOF > /etc/sysctl.d/kubernetes.conf
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward = 1
    EOF

- name: Apply sysctl parameters
  command: sysctl --system
